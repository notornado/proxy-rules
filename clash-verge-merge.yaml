# Clash Verge Rev —— Merge 配置
# 用法：Verge → 配置 → 新建 Merge → 粘贴本文件内容 → 关联到 Nexitally 订阅 → 启用 → 手动更新规则集
# Mac 和 PC 内容完全一样，原样粘贴即可。

# Nexitally 订阅里没有日本节点组，这里从全部节点里按名字筛出来建一个。
prepend-proxy-groups:
  - name: 🗾Japan
    type: select
    include-all: true
    filter: "(?i)japan|日本|🇯🇵"

rule-providers:
  my-direct:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/<GH_USER>/proxy-rules/main/my-direct.list"
    path: ./ruleset/my-direct.list
    interval: 3600
  my-japan:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/<GH_USER>/proxy-rules/main/my-japan.list"
    path: ./ruleset/my-japan.list
    interval: 3600
  my-proxy:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/<GH_USER>/proxy-rules/main/my-proxy.list"
    path: ./ruleset/my-proxy.list
    interval: 3600

# 顺序即优先级：直连兜底最先，然后日本，最后主代理组。
prepend-rules:
  - RULE-SET,my-direct,DIRECT
  - RULE-SET,my-japan,🗾Japan
  - RULE-SET,my-proxy,Proxies
